<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.82" cy="0.05" r="0.6">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#7c8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="1" r="0.55">
      <stop offset="0" stop-color="#5ee3c1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5ee3c1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c8cff"/>
      <stop offset="1" stop-color="#5ee3c1"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c8cff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#7c8cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#5ee3c1" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="420" rx="24" fill="url(#grid)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowA)"/>
  <rect width="1280" height="420" rx="24" fill="url(#glowB)"/>

  <!-- network topology, right side -->
  <g transform="translate(860 70)" fill="none" stroke-linecap="round">
    <g stroke="#7c8cff" stroke-opacity="0.35" stroke-width="1.5">
      <path d="M60 60 L200 30 L330 110 L220 200 L80 230 Z"/>
      <path d="M60 60 L220 200 M200 30 L80 230 M330 110 L80 230"/>
      <path d="M330 110 L380 250 L220 200"/>
    </g>
    <g fill="#0b0f1a" stroke-width="2.5">
      <circle cx="60" cy="60" r="10" stroke="#7c8cff"/>
      <circle cx="200" cy="30" r="8" stroke="#5ee3c1"/>
      <circle cx="330" cy="110" r="12" stroke="#7c8cff"/>
      <circle cx="220" cy="200" r="9" stroke="#5ee3c1"/>
      <circle cx="80" cy="230" r="8" stroke="#7c8cff"/>
      <circle cx="380" cy="250" r="7" stroke="#5ee3c1"/>
    </g>
    <circle cx="330" cy="110" r="22" stroke="#7c8cff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="330" cy="110" r="34" stroke="#7c8cff" stroke-opacity="0.12" stroke-width="2"/>
  </g>

  <!-- latency trace along the bottom -->
  <path d="M0 352 H180 l14 -30 l18 58 l16 -74 l14 46 h120 l10 -18 l12 30 l10 -12 H700 l14 -40 l16 70 l14 -48 l10 18 H1280"
        fill="none" stroke="url(#trace)" stroke-width="3" stroke-linejoin="round" filter="url(#soft)" opacity="0.6"/>
  <path d="M0 352 H180 l14 -30 l18 58 l16 -74 l14 46 h120 l10 -18 l12 30 l10 -12 H700 l14 -40 l16 70 l14 -48 l10 18 H1280"
        fill="none" stroke="url(#trace)" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- logo -->
  <g transform="translate(80 92)">
    <rect width="76" height="76" rx="20" fill="url(#brand)"/>
    <path d="M14 40h11l6-15 10 27 7-17 4 5h11" fill="none" stroke="#fff" stroke-width="4.6"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="178" y="148" font-size="68" font-weight="800" fill="#f3f5fa" letter-spacing="-1.5">NetDeck</text>
    <text x="82" y="222" font-size="27" font-weight="500" fill="#c3cad8">Every network troubleshooting tool, one beautiful dashboard.</text>

    <!-- tool chips -->
    <g font-family="'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, Consolas, monospace" font-size="17" font-weight="600">
      <g transform="translate(82 254)">
        <rect width="72" height="36" rx="18" fill="#7c8cff" fill-opacity="0.14" stroke="#7c8cff" stroke-opacity="0.35"/>
        <text x="36" y="24" text-anchor="middle" fill="#aab4ff">ping</text>
      </g>
      <g transform="translate(166 254)">
        <rect width="66" height="36" rx="18" fill="#5ee3c1" fill-opacity="0.12" stroke="#5ee3c1" stroke-opacity="0.35"/>
        <text x="33" y="24" text-anchor="middle" fill="#8ff0d6">mtr</text>
      </g>
      <g transform="translate(244 254)">
        <rect width="78" height="36" rx="18" fill="#7c8cff" fill-opacity="0.14" stroke="#7c8cff" stroke-opacity="0.35"/>
        <text x="39" y="24" text-anchor="middle" fill="#aab4ff">nmap</text>
      </g>
      <g transform="translate(334 254)">
        <rect width="106" height="36" rx="18" fill="#5ee3c1" fill-opacity="0.12" stroke="#5ee3c1" stroke-opacity="0.35"/>
        <text x="53" y="24" text-anchor="middle" fill="#8ff0d6">tcpdump</text>
      </g>
      <g transform="translate(452 254)">
        <rect width="62" height="36" rx="18" fill="#7c8cff" fill-opacity="0.14" stroke="#7c8cff" stroke-opacity="0.35"/>
        <text x="31" y="24" text-anchor="middle" fill="#aab4ff">dig</text>
      </g>
      <g transform="translate(526 254)">
        <rect width="94" height="36" rx="18" fill="#5ee3c1" fill-opacity="0.12" stroke="#5ee3c1" stroke-opacity="0.35"/>
        <text x="47" y="24" text-anchor="middle" fill="#8ff0d6">iperf3</text>
      </g>
      <g transform="translate(632 254)">
        <rect width="112" height="36" rx="18" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.18"/>
        <text x="56" y="24" text-anchor="middle" fill="#c3cad8">+50 more</text>
      </g>
    </g>
  </g>
</svg>
