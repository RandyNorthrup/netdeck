name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: pip install ruff
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: make lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest websocket-client
      - name: Tests (including browser tests in the runner's Chrome)
        run: make test
        env:
          NETDECK_REQUIRE_E2E: "1"

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest
      - name: Upgrade tests (installer stops and restarts a running NetDeck)
        run: python -m pytest -v tests/test_install.py
        env:
          NETDECK_TEST_INSTALL: "1"
      - name: Install with the user installer
        run: ./scripts/install.sh
      - name: Smoke test
        run: |
          ~/.local/bin/netdeck --version
          ~/.local/bin/netdeck doctor
      - name: Uninstall
        run: ./scripts/uninstall.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/
