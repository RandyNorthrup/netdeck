<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetDeck — Locked</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
</head>
<body>
  <div class="locked">
    <div class="card">
      <h1>NetDeck is locked</h1>
      <p>This session isn't authorized. For your security, NetDeck only accepts the private link it prints when it starts.</p>
      <p>Run <code>netdeck</code> again (it reopens the running instance), or print the link with <code>netdeck url</code>.</p>
    </div>
  </div>
</body>
</html>
