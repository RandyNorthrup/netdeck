<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>NetDeck</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="brand">
        <div class="brand-logo" id="brand-logo"></div>
        <div><div class="brand-name">NetDeck</div><div class="brand-sub">Network toolkit</div></div>
      </div>
      <button class="search-btn" id="open-palette" type="button">
        <span class="ic" id="search-icon"></span><span class="label">Search tools…</span><kbd>Ctrl K</kbd>
      </button>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn icon ghost menu-btn" id="menu-btn" type="button" aria-label="Open navigation"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <div id="top-status"></div>
        <button class="btn icon ghost" id="theme-btn" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
        <button class="btn icon ghost exit-btn" id="exit-btn" type="button" aria-label="Exit NetDeck" title="Exit NetDeck"></button>
      </header>
      <div class="content" id="content"><div class="empty"><div class="spinner"></div></div></div>
    </main>
  </div>
  <div class="palette-wrap" id="palette" role="dialog" aria-modal="true" aria-label="Search tools">
    <div class="palette">
      <div class="palette-input"><span id="palette-icon"></span><input id="palette-q" placeholder="Search tools, categories and pages…" autocomplete="off" spellcheck="false"></div>
      <div class="palette-list" id="palette-list" role="listbox"></div>
      <div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <dialog class="modal" id="exit-dialog" aria-labelledby="exit-title" aria-describedby="exit-desc">
    <form method="dialog" class="modal-body">
      <div class="modal-icon" id="exit-icon"></div>
      <h2 id="exit-title">Exit NetDeck?</h2>
      <p id="exit-desc">This shuts down the NetDeck server.</p>
      <div id="exit-jobs" hidden>
        <p class="modal-strong" id="exit-jobs-title"></p>
        <ul class="modal-list" id="exit-jobs-list"></ul>
      </div>
      <p class="modal-note">Terminal windows and desktop apps you opened from NetDeck stay open.</p>
      <div class="modal-actions">
        <button class="btn" value="cancel" id="exit-cancel" autofocus>Cancel</button>
        <button class="btn danger-solid" value="exit" id="exit-confirm">Exit NetDeck</button>
      </div>
    </form>
  </dialog>
  <div class="stopped" id="stopped" hidden>
    <div class="card" role="status" aria-live="assertive">
      <div class="stopped-icon" id="stopped-icon"></div>
      <h1 id="stopped-title" tabindex="-1">NetDeck has stopped</h1>
      <p id="stopped-text"></p>
      <p class="stopped-hint">To start it again, run <code>netdeck</code> or open NetDeck from your app menu.</p>
    </div>
  </div>
</body>
</html>
