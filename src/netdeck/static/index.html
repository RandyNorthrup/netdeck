<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>NetDeck</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/theme.js"></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="brand">
        <div class="brand-logo" id="brand-logo"></div>
        <div><div class="brand-name">NetDeck</div><div class="brand-sub">Network toolkit</div></div>
      </div>
      <button class="search-btn" id="open-palette" type="button">
        <span class="ic" id="search-icon"></span><span class="label">Search tools…</span><kbd>Ctrl K</kbd>
      </button>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn icon ghost menu-btn" id="menu-btn" type="button" aria-label="Open navigation"></button>
        <div class="crumbs" id="crumbs"></div>
        <div class="spacer"></div>
        <div id="top-status"></div>
        <button class="btn icon ghost" id="theme-btn" type="button" aria-label="Toggle theme" title="Toggle theme"></button>
      </header>
      <div class="content" id="content"><div class="empty"><div class="spinner"></div></div></div>
    </main>
  </div>
  <div class="palette-wrap" id="palette" role="dialog" aria-modal="true" aria-label="Search tools">
    <div class="palette">
      <div class="palette-input"><span id="palette-icon"></span><input id="palette-q" placeholder="Search tools, categories and pages…" autocomplete="off" spellcheck="false"></div>
      <div class="palette-list" id="palette-list" role="listbox"></div>
      <div class="palette-foot"><span><kbd>↑</kbd> <kbd>↓</kbd> navigate</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
